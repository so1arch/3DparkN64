<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N64 Parkour</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { width: 100vw; height: 100vh; overflow: hidden; background: #000; font-family: monospace; color: #fff; }
    #game { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: absolute; inset: 0; }
    canvas { width: 100% !important; height: 100% !important; object-fit: contain; image-rendering: pixelated; display: block; }
    
    #hud { position: absolute; top: 12px; left: 12px; font-size: 16px; text-shadow: 2px 2px #000; display: flex; gap: 16px; pointer-events: none; z-index: 2; }
    #msg { position: absolute; inset: 0; background: rgba(0,0,0,0.7); display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 24px; line-height: 1.6; z-index: 8; pointer-events: none; }
    body.menu #msg { display: none !important; }
    #toast { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 8px 16px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 20; }
    #toast.show { opacity: 1; }
    #status { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); color: #ffeb3b; font-size: 14px; text-shadow: 1px 1px #000; z-index: 30; pointer-events: none; text-align: center; }
    #help { position: absolute; bottom: 12px; right: 12px; font-size: 12px; text-align: right; opacity: 0.7; white-space: pre-line; text-shadow: 1px 1px #000; pointer-events: none; z-index: 2; }
    
    #playmenu { position: absolute; top: 12px; right: 12px; z-index: 5; padding: 6px 12px; }
    body.editing #playmenu, body.menu #playmenu { display: none; }
    body.menu #hud, body.menu #help { display: none; }
    body.editing #hud { display: none; }
    
    .screen { position: absolute; inset: 0; background: rgba(10,15,30,0.92); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 10; }
    .screen.on { display: flex; }
    .title { font-size: 32px; font-weight: bold; margin-bottom: 10px; color: #ffd700; text-shadow: 3px 3px #000; }
    
    button, input, select { font-family: inherit; font-size: 14px; background: #223; color: #fff; border: 1px solid #557; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    button:hover { background: #335; border-color: #88a; }
    button.on { background: #4a2; border-color: #8f5; }
    .btn { min-width: 180px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; max-width: 92vw; }
    
    #edbar { position: absolute; top: 12px; left: 12px; display: none; flex-direction: column; gap: 8px; z-index: 5; }
    body.editing #edbar { display: flex; }
    #tools { display: flex; gap: 4px; flex-wrap: wrap; max-width: 360px; }
    .slot { display: flex; flex-direction: column; align-items: center; width: 48px; padding: 4px; font-size: 10px; }
    .slot .ic { font-size: 18px; margin: 2px 0; }
    #shapes { display: flex; gap: 4px; flex-wrap: wrap; max-width: 320px; }
    #shapes button { width: 32px; min-width: 0; height: 32px; padding: 0; font-size: 16px; } /* min-width от .btn раздувал кнопки форм до 180px, и часть кнопок уезжала за экран */
    #edinfo { position: absolute; top: 12px; right: 12px; display: none; text-align: right; font-size: 12px; text-shadow: 1px 1px #000; white-space: pre-line; z-index: 5; pointer-events: none; }
    body.editing #edinfo { display: block; }
    #drawbox { display: none; background: rgba(0,0,0,0.6); padding: 8px; border-radius: 4px; font-size: 12px; max-width: 260px; }
    
    .pv-ph { width: 180px; height: 240px; display: flex; align-items: center; justify-content: center; background: #030810; color: #666; font-size: 12px; }
    #worklist { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; width: 320px; }
    #worklist .item { display: flex; gap: 6px; }
    #worklist .item button { flex: 1; text-align: left; }

    #props { display: none; position: absolute; bottom: 12px; left: 12px; background: rgba(10,15,30,0.9); padding: 10px; border-radius: 6px; flex-wrap: wrap; gap: 8px; max-width: 600px; z-index: 6; }
    body.editing:not(.noprops) #props { display: flex; }
  </style>
</head>
<body>
  <div id="game"></div>

  <div id="hud">
    <div id="lvname" style="font-weight:bold;color:#ffd700;"></div>
    <div id="hCoins">×0/0</div>
    <div id="hNeed" style="color:#ff5555"></div>
    <div>⏱ <span id="hTime">0.0</span>s</div>
    <div>🏆 <span id="hBest">--</span></div>
  </div>

  <button id="playmenu" class="openmenu" title="Меню (Esc)">☰ Меню</button>
  <div id="msg"></div>
  <div id="toast"></div>
  <div id="status"></div>
  <div id="help"></div>

  <!-- Панель редактора -->
  <div id="edbar">
    <div class="row">
      <button class="openmenu">☰ Меню</button>
      <button id="btnTest">▶ Тест</button>
      <button id="btnUndo">↶ Отмена</button>
      <button id="btnProps">⚙ Настройки</button>
    </div>
    <div id="tools"></div>
    <div id="shapes"></div>
    <div class="row" style="font-size:12px;">
      <span id="shapename">Форма</span>
      <button id="btnDelShape" style="padding:2px 6px;font-size:10px;">Удалить</button>
    </div>
    <div id="drawbox">
      <div id="drawinfo"></div>
      <div class="row" style="margin-top:4px;">
        <button id="btnDrawDone">Замкнуть</button>
        <button id="btnDrawUndo">Сбросить точку</button>
        <button id="btnDrawCancel">Отмена</button>
      </div>
    </div>
  </div>

  <div id="edinfo"></div>

  <!-- Главное меню -->
  <div id="scr-main" class="screen">
    <div class="title">N64 Parkour</div>
    <button id="mPlay" class="btn">▶ Играть</button>
    <button id="mLevels" class="btn">🎯 Уровни</button>
    <button id="mEdit" class="btn">✏ Редактор</button>
    <button id="mWork" class="btn">🌐 Мастерская</button>
    <button id="mChar" class="btn">👕 Персонаж</button>
    <button id="mSet" class="btn">⚙ Настройки</button>
    <button id="mCtl" class="btn">⌨ Управление</button>
  </div>

  <!-- Выбор уровней -->
  <div id="scr-levels" class="screen">
    <div class="title">Выбор уровня</div>
    <button id="btnClassic" class="btn">Классика</button>
    <div class="row">
      <input id="seed" placeholder="Сид уровня" style="width:110px;">
      <select id="seedStyle"></select>
      <select id="seedDiff"></select>
      <button id="btnSeed">Создать</button>
      <button id="btnRand">🎲</button>
    </div>
    <div class="row">
      <input id="code" placeholder="Код уровня" style="width:180px;">
      <button id="btnCode">Загрузить</button>
    </div>
    <button class="back btn">Назад</button>
  </div>

  <!-- Мастерская -->
  <div id="scr-work" class="screen">
    <div class="title">Мастерская</div>
    <div id="worklist">Загрузка…</div>
    <button id="btnWork" class="btn">Обновить</button>
    <button class="back btn">Назад</button>
  </div>

  <!-- Персонаж -->
  <div id="scr-char" class="screen">
    <div class="title">Персонаж</div>
    <div id="charPreview"></div>
    <div class="row">
      <select id="skinSel"></select>
      <button id="btnSkinRand">🎲</button>
    </div>
    <div class="row" style="font-size:12px;">
      Штаны <input type="color" id="skLegs">
      Майка <input type="color" id="skShirt">
      Голова <input type="color" id="skHead">
    </div>
    <div class="row" style="font-size:12px;">
      Кепка <input type="color" id="skCap">
      Пояс <input type="color" id="skBelt">
    </div>
    <button class="back btn">Назад</button>
  </div>

  <!-- Настройки -->
  <div id="scr-settings" class="screen">
    <div class="title">Настройки</div>
    <div class="row">Графика: <select id="qualitySel"><option value="high">HIGH (PBR + SSAO)</option><option value="light">LIGHT (Быстро)</option></select></div>
    <div class="row">FPS: <select id="fpsSel"><option value="0">Максимум</option><option value="60">60 FPS</option><option value="30">30 FPS</option></select></div>
    <div class="row">Музыка: <select id="musicPreset"><option value="0">Выкл</option><option value="1">Расслабляющая</option><option value="2">Импульсивная</option><option value="3">Мелодичная</option></select></div>
    <div class="row">Громкость: <input type="range" id="musicVol" min="0" max="1" step="0.02" style="width:100px;"></div>
    <button id="btnReset" class="btn" style="background:#822;">Сбросить рекорды</button>
    <button class="back btn">Назад</button>
  </div>

  <!-- Управление -->
  <div id="scr-controls" class="screen">
    <div class="title">Управление</div>
    <div style="font-size:13px;line-height:1.8;text-align:left;">
      <b>WASD</b> — Бег<br>
      <b>Пробел</b> — Прыжок<br>
      <b>Q / E, Мышь</b> — Камера<br>
      <b>R</b> — Рестарт уровня<br>
      <b>Esc / M</b> — Меню
    </div>
    <button class="back btn">Назад</button>
  </div>

  <!-- Панель свойств -->
  <div id="props">
    <input id="ename" placeholder="Название уровня">
    <label><input type="checkbox" id="edreq"> Монеты обязательны</label>
    <select id="edtheme"></select>
    <input type="number" id="edw" placeholder="Ширина">
    <input type="number" id="edd" placeholder="Глубина">
    <input type="number" id="edrot" placeholder="Поворот">
    <input type="number" id="edtilt" placeholder="Наклон">
    <input type="number" id="edk" placeholder="Толщина">
    <input type="number" id="edh" placeholder="Высота">
    <select id="edstep"><option value="0.5">Шаг 0.5</option><option value="1">Шаг 1</option><option value="0.1">Шаг 0.1</option></select>
    <label><input type="checkbox" id="edsnap" checked> Прилипание</label>
    <button id="btnNew">Новый уровень</button>
    <button id="camTop">Вид сверху</button>
    <button id="camSide">Вид сбоку</button>
    <button id="camFit">Вся карта</button>
    <button class="link">Скопировать ссылку</button>
    <button id="btnSubmit">В Мастерскую</button>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
